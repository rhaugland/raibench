name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  sdk-tests:
    name: SDK Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        working-directory: sdk
        run: pip install pydantic httpx pytest pytest-asyncio
      - name: Run tests
        working-directory: sdk
        run: PYTHONPATH=src python -m pytest tests/test_autopatch.py -v

  api-lint:
    name: API Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: api
        run: pip install ruff
      - name: Ruff check
        working-directory: api
        run: ruff check src/

  dashboard-build:
    name: Dashboard Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        working-directory: dashboard
        run: npm ci
      - name: Type check & build
        working-directory: dashboard
        run: npx next build
        env:
          NEXT_PUBLIC_API_URL: https://raibench-api.fly.dev

[project]
name = "raibench"
version = "0.1.0"
description = "Production intelligence SDK for AI applications"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/raibench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
